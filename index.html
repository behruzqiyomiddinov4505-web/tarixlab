<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TarixLab — Qadimgi dunyo tarixi</title><style>body{font:17px system-ui;background:#0d1630;color:#f2f6ff;margin:0}main{max-width:750px;margin:auto;padding:24px}h1{color:#8dd6ff}.card{background:#192749;padding:22px;border-radius:18px;margin:16px 0}button{display:block;width:100%;padding:15px;margin:10px 0;background:#29436b;border:1px solid #59779c;color:white;border-radius:12px;text-align:left;font-size:17px}button:active{background:#247e8c}.muted{color:#a9bcd5}.tag{color:#9be9c5}</style><main><h1>📚 TarixLab</h1><p>6-sinf · Qadimgi dunyo tarixi</p><div id="app"></div></main><script>
const questions=[
["Mezolit davri qaysi davrni anglatadi?",["O‘rta tosh davri","Yangi tosh davri","Mis-tosh davri","Temir davri"],0],
["O‘rta Osiyoda mezolit davri qaysi ming yilliklarni qamrab oladi?",["Mil. avv. XII–VII ming yilliklar","Mil. avv. VI–IV ming yilliklar","Mil. avv. II–I ming yilliklar","Milodiy I–II asrlar"],0],
["O‘q-yoy qaysi davrda ixtiro qilingan?",["Mezolit","Bronza","Temir","Eneolit"],0],
["Neolit so‘zi nimani anglatadi?",["Yangi tosh davri","Qadimgi tosh davri","O‘rta tosh davri","Mis-tosh davri"],0],
["O‘rta Osiyoda neolit davri qaysi ming yilliklarga to‘g‘ri keladi?",["Mil. avv. VI–IV ming yilliklar","Mil. avv. XII–VII ming yilliklar","Mil. avv. IX–VIII asrlar","Mil. avv. II–I asrlar"],0],
["Kulolchilik va to‘qimachilik qaysi davrda rivojlangan?",["Neolit","Paleolit","Ilk temir","Mezolit"],0],
["Eneolit davri qanday nomlanadi?",["Mis-tosh davri","Yangi tosh davri","O‘rta tosh davri","Temir davri"],0],
["Kulolchilik charxi va g‘ildirak qaysi davr ixtirolaridan?",["Bronza davri","Mezolit","Paleolit","Ilk temir"],0],
["Xettlar temirdan qaysi asrlarda foydalangan?",["Mil. avv. XIV–XIII asrlar","Mil. avv. IV–III asrlar","Milodiy I–II asrlar","Mil. avv. IX–VIII asrlar"],0],
["O‘rta Osiyoda temir qurollar qaysi asrlarda tarqala boshlagan?",["Mil. avv. IX–VIII asrlar","Mil. avv. XIV–XIII asrlar","Milodiy V–VI asrlar","Mil. avv. III–II asrlar"],0]
];let items=[],i=0,score=0;const app=document.getElementById('app');function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function home(){app.innerHTML='<div class="card"><h2>Sinov testlari</h2><p>Hozircha 10 ta savol mavjud. 32 mavzuli to‘liq baza hali nashr qilinmagan.</p><button id="start">Testni boshlash</button></div>';document.getElementById('start').onclick=()=>{items=shuffle(questions.map(q=>({q:q[0],a:shuffle(q[1].map((t,j)=>({t,correct:j===q[2]})))})));i=0;score=0;render()}}function render(){if(i>=items.length){app.innerHTML='<div class="card"><h2>Natija</h2><p>'+score+' / '+items.length+' ta to‘g‘ri javob</p><button id="again">Qayta ishlash</button></div>';document.getElementById('again').onclick=home;return}let q=items[i];app.innerHTML='<div class="card"><p class="tag">Savol '+(i+1)+' / '+items.length+'</p><h2>'+q.q+'</h2><div id="answers"></div></div>';let a=document.getElementById('answers');q.a.forEach((v,j)=>{let b=document.createElement('button');b.textContent='ABCD'[j]+'. '+v.t;b.onclick=()=>{if(v.correct)score++;i++;render()};a.appendChild(b)})}home();</script></html>
